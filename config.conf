#!/hint/bash

# 程序的文件夹名称 程序会在 "./program/$VERSION/FFmpegFreeUI.exe"
# 例如 VERSION="FFmpegFreeUI ReadyToRun x64"
# 如果需要多版本管理 可以修改此值
# 或填入 auto 使其自动检测 (仅适用于单版本)
VERSION="auto"

# Wine 程序
# 必须为原版 wine! 不能是 wine-staging 或 proton!
WINE="wine"
WINE_CFG="winecfg"
WINE_SERVER="wineserver"

# Wine Prefix
WINE_PREFIX="./pfx"
WINE_ARCH="win64"

# 跳过安装中文字体步骤 手动安装微软雅黑
SKIP_FAKECHINESE="n"
FONT_FILE="SourceHanSerif.ttc"
FONT_NAME="Source Han Serif"

# 是否在程序结束后运行 wineserver -k
WINE_SERVER_KILL="y"
